
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d19">
  <title>MyProxy Browser</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #090d19;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: #10182a;
      border-bottom: 1px solid #28334c;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      color: #7185ff;
    }

    .online {
      color: #5bd6a0;
      font-size: 13px;
    }

    main {
      max-width: 850px;
      width: 90%;
      margin: 110px auto;
      text-align: center;
    }

    h1 {
      font-size: clamp(40px, 7vw, 65px);
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    h1 span {
      color: #7185ff;
    }

    .description {
      color: #9ba9c5;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .address-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: #151e32;
      border: 1px solid #303c5c;
      border-radius: 13px;
    }

    .address-bar:focus-within {
      border-color: #7185ff;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: #75829e;
    }

    button {
      padding: 14px 24px;
      background: #7185ff;
      border: none;
      border-radius: 9px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #596ff0;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      color: #9ba9c5;
      font-size: 13px;
      margin-top: 20px;
      min-height: 22px;
    }

    .browser {
      display: none;
      margin-top: 35px;
      text-align: left;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #151e32;
      border: 1px solid #303c5c;
      border-radius: 12px 12px 0 0;
    }

    .tool-button {
      background: #26324d;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 17px;
    }

    .current-address {
      flex: 1;
      min-width: 0;
      color: #aab7d0;
      font-size: 12px;
      padding: 10px;
      overflow-wrap: anywhere;
    }

    .website {
      min-height: 500px;
      background: white;
      border: 1px solid #303c5c;
      border-top: none;
      border-radius: 0 0 12px 12px;
      color: #111;
      padding: 25px;
    }

    .website iframe {
      width: 100%;
      height: 650px;
      border: none;
      background: white;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #66738f;
      font-size: 12px;
      border-top: 1px solid #20283c;
    }

    @media(max-width: 600px) {
      main {
        margin: 70px auto;
      }

      .address-bar {
        flex-direction: column;
      }

      input, .address-bar button {
        width: 100%;
      }

      .toolbar {
        flex-wrap: wrap;
      }

      .website {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">My<span>Proxy</span></div>
    <div class="online">● Online</div>
  </header>

  <main>

    <h1>Browse the <span>Web.</span></h1>

    <p class="description">
      Enter a website address and open it in your personal proxy browser.
    </p>

    <form class="address-bar" id="searchForm">
      <input
        type="text"
        id="urlInput"
        placeholder="Enter website URL..."
        autocomplete="url"
        required
      >
      <button type="submit" id="goButton">GO →</button>
    </form>

    <div class="message" id="message" aria-live="polite">
      Try https://example.com
    </div>

    <section class="browser" id="browser">

      <div class="toolbar">
        <button class="tool-button" id="backButton" title="Back">←</button>
        <button class="tool-button" id="forwardButton" title="Forward">→</button>
        <button class="tool-button" id="refreshButton" title="Refresh">↻</button>

        <div class="current-address" id="currentAddress"></div>
      </div>

      <div class="website" id="website">
        <p>Loading website...</p>
      </div>

    </section>

  </main>

  <footer>
    MyProxy © 2026 · Personal Proxy Browser
  </footer>

  <script src="/app.js" defer></script>

</body>
</html>
